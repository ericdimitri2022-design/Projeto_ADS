<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bônus Especial</title>
  <style>
    body { background: #f3f4f6; font-family: "Poppins", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; padding: 30px 25px; box-shadow: 0 3px 15px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
    h1 { color: #16a34a; margin-bottom: 10px; font-size: 24px; }
    p { color: #333; margin-bottom: 25px; font-size: 15px; }
    a.btn { background: #4f46e5; color: #fff; text-decoration: none; padding: 12px 28px; border-radius: 10px; font-weight: 600; display: inline-block; transition: background-color 0.3s ease; }
    a.btn:hover { background: #3730a3; }
    .native-ad-container { margin-top: 25px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Parabéns!</h1>
    <p>Seu bônus foi liberado. Aproveite seu conteúdo exclusivo abaixo 👇</p>
    <a href="#" target="_blank" class="btn" id="botao-acesso">ACESSAR AGORA</a>
    
    <div class="native-ad-container">
        <script async="async" data-cfasync="false" src="//victimfatalsentiments.com/fc9e45b5ad616584db5c86a8934458a0/invoke.js"></script>
        <div id="container-fc9e45b5ad616584db5c86a8934458a0"></div>
    </div>
  </div>

  <script type='text/javascript' src='//victimfatalsentiments.com/01/81/75/0181758b919925fc16429ef442fcd016.js'></script>

  <script>
    window.onload = function() {
      const botaoAcesso = document.getElementById('botao-acesso');
      const urlParams = new URLSearchParams(window.location.search);
      const destinoParam = urlParams.get('destino'); // Pega o parâmetro (pode ser Base64 ou URL)
      const linkPadrao = "https://www.google.com"; 
      
      let linkFinal = linkPadrao; // Começa com o padrão

      if (destinoParam) {
          try {
              // Tenta decodificar como Base64
              linkFinal = atob(destinoParam);
              // Verifica se o resultado parece uma URL válida (opcional, mas bom)
              if (!linkFinal.startsWith('http://') && !linkFinal.startsWith('https://')) {
                  console.warn("Resultado da decodificação Base64 não parece uma URL válida:", linkFinal);
                  linkFinal = destinoParam; // Volta a usar o parâmetro original se a decodificação falhar
              }
          } catch(e) {
              // Se atob falhar, assume que já era uma URL normal
              console.log("Parâmetro 'destino' não é Base64, usando como URL direta.");
              linkFinal = destinoParam; 
          }
      }
      
      // Define o link final no botão
      botaoAcesso.href = linkFinal;
    };
  </script>
</body>
</html>
